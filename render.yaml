services:
  - type: web
    name: children-book
    env: node
    plan: free
    buildCommand: npm install && npm run db:setup && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        value: file:./dev.db
      # Fill these in the Render dashboard (secrets are not committed):
      # AUTH_SECRET  — 64 hex chars; generate with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      # ADMIN_PASSWORD — the admin console password
      - key: AUTH_SECRET
        value: ""
      - key: ADMIN_USERNAME
        value: lingtika
      - key: ADMIN_PASSWORD
        value: ""
